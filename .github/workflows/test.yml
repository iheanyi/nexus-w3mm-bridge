name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test, build, and smoke-test relocated Windows package
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: NexusW3MMBridge-${{ matrix.os }}-x64
          path: dist/NexusW3MMBridge
          if-no-files-found: error
